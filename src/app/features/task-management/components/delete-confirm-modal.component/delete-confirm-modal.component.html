<div class="modal-backdrop" *ngIf="visible" (click)="$event.stopPropagation()">
  <div class="delete-modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>DELETE TASK</h2>
      <span class="close-icon" (click)="$event.stopPropagation(); cancel.emit()">✕</span>
    </div>

    <p class="modal-text">
      Are you sure you want to delete <strong>"{{ itemName }}"</strong>?
    </p>

    <p class="modal-subtext">
      This action cannot be undone.
    </p>

    <div class="modal-actions">
      <button class="delete-btn" (click)="$event.stopPropagation(); confirm.emit()">Delete</button>
      <button class="cancel-btn" (click)="$event.stopPropagation(); cancel.emit()">Cancel</button>
    </div>

  </div>
</div>
