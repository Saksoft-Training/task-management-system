<div class="overlay" *ngIf="open" (click)="close.emit()"></div>

<div *ngIf="open"
     class="filter-panel"
     [class.open]="open">

  <div class="header">
    <h2>FILTER TASKS</h2>
    <button class="close-btn" (click)="close.emit()">✕</button>
  </div>

  <!-- STATUS -->
  <div class="box">
    <div class="box-title">
      <span>⚪ Status</span>
      <button class="clear" (click)="clearSection('status')">Clear Filters</button>
    </div>

    <div class="options">
      <label *ngFor="let s of statusList">
        <input type="checkbox"
               [checked]="filters.status.includes(s)"
               (change)="toggleCheck(filters.status, s)">
        {{ s }}
      </label>
    </div>
  </div>

  <!-- PRIORITY -->
  <div class="box">
    <div class="box-title">
      <span>🚩 Priority</span>
      <button class="clear" (click)="clearSection('priority')">Clear Filters</button>
    </div>

    <div class="options">
      <label *ngFor="let p of priorityList">
        <input type="checkbox"
               [checked]="filters.priority.includes(p)"
               (change)="toggleCheck(filters.priority, p)">
        {{ p }}
      </label>
    </div>
  </div>

  <!-- ASSIGNEE -->
  <div class="box">
    <div class="box-title">
      <span>👤 Assignee</span>
    </div>

    <div class="options">
      <label *ngFor="let a of assignees">
        <input type="checkbox"
               [checked]="filters.assignee.includes(a)"
               (change)="toggleCheck(filters.assignee, a)">
        {{ a }}
      </label>
    </div>
  </div>

  <!-- DUE DATE -->
  <div class="box">
    <div class="box-title">
      <span>📅 Due Date Range</span>
    </div>

    <div class="date-row">
      <div>
        <label>From</label>
        <input type="date" [(ngModel)]="filters.fromDate" (change)="filtersChanged.emit(filters)">
      </div>
      <div>
        <label>To</label>
        <input type="date" [(ngModel)]="filters.toDate" (change)="filtersChanged.emit(filters)">
      </div>
    </div>
  </div>

  <button class="clear-all" (click)="clearAll()">
    ✕ Clear All Filters
  </button>

</div>
