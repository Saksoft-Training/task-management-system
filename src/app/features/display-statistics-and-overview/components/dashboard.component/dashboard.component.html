<p>dashboard.component works!</p>
<section class="dashboard-page">
    <h2>Overview</h2>
    <div *ngIf="loading" class="loading-note">Loading statistics…</div>
    <ng-container *ngIf="(stats$ | async) as stats">
        <div class="grid">
            <app-statistics-card [label]="'Total Projects'" [value]="stats.totalProjects" [icon]="' '" colorClass="blue"
                [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Active Projects'" [value]="stats.activeProjects" [icon]="' '"
                colorClass="amber" [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Completed Projects'" [value]="stats.completedProjects" [icon]="' '"
                colorClass="green" [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Total Tasks'" [value]="stats.totalTasks" [icon]="' '" colorClass="neutral"
                [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Completed Tasks'" [value]="stats.completedTasks" [icon]="' '"
                colorClass="green" [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'In Progress Tasks'" [value]="stats.inProgressTasks" [icon]="' '"
                colorClass="amber" [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Overdue Tasks'" [value]="stats.overdueTasks" [icon]="' '" colorClass="red"
                [loading]="loading"></app-statistics-card>
            <app-statistics-card [label]="'Completion Rate'" [value]="stats.overallCompletionRate + '%'" [icon]="' '"
                colorClass="blue" [loading]="loading"></app-statistics-card>
        </div>
        <div *ngIf="stats.totalProjects === 0 && stats.totalTasks === 0" class="empty-state">
            No projects or tasks found. Add a project to get started.
        </div>
    </ng-container>
</section>
