<button class="stat-card" [ngClass]="colorClass" [attr.aria-label]="label">
    <div *ngIf="loading" class="skeleton">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
    </div>
    <ng-container *ngIf="!loading">
        <div class="statistic-card">
            <div class="content">
                <div class="label">{{ label }}</div>
                <div class="value">{{ value }} <small *ngIf="subValue">{{ subValue }}</small>
                </div>
            </div>
            <div class="icon" *ngIf="icon">
                <img [src]="icon" [alt]="label + ' icon'" *ngIf="icon.includes('.svg')" />
                <span *ngIf="!icon.includes('.svg')">{{ icon }}</span>
            </div>
        </div>
         <div class="meta">
                <div class="status-badge-card" *ngIf="status">{{ status }}</div>
                <div class="trend" *ngIf="showTrend"></div>
            </div>
    </ng-container>
</button>
