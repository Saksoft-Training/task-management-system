<div class="notification-item"
     [class.unread]="!notification.isRead"
     (click)="onNavigate()">

  <div class="icon" [ngClass]="severityClass">
    <ng-container [ngSwitch]="notification.severity">
      <span *ngSwitchCase="'success'">✅</span>
      <span *ngSwitchCase="'warning'">⚠️</span>
      <span *ngSwitchCase="'critical'">⛔</span>
      <span *ngSwitchDefault>🔔</span>
    </ng-container>
  </div>

  <div class="content">
    <div class="title">{{ notification.title }}</div>
    <div class="message">{{ notification.message }}</div>
    <div class="timestamp">{{ notification.timestamp | date: 'short' }}</div>
  </div>

  <div class="actions">
    <button *ngIf="!notification.isRead"
            (click)="onMarkRead($event)">
      Mark as read
    </button>
    <button (click)="onDismiss($event)">
      ✕
    </button>
  </div>
</div>
