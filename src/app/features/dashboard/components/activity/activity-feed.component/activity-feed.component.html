 <div class="card">
      <div class="header">
        <h3>Recent Activities</h3>
        <span class="subtitle">Last 15 activities</span>
      </div>

      <div class="content">
        <div *ngIf="activities.length === 0" class="empty-state">
          <p>No activities yet</p>
        </div>

        <div class="activity-list" *ngIf="activities.length > 0">
          <div class="activity-item" *ngFor="let activity of activities">
            <div class="activity-avatar">
              <span>{{ activity.userInitials }}</span>
            </div>

            <div class="activity-details">
              <div class="activity-header">
                <span class="user-name">{{ activity.userName }}</span>
                <span class="action-text">{{ activity.action }}</span>
                <span class="item-name">{{ activity.itemName }}</span>
              </div>
              <div class="activity-footer">
                <span class="item-type" [ngClass]="activity.itemType">{{
                  activity.itemType
                }}</span>
                <span class="timestamp">{{ formatTime(activity.timestamp) }}</span>
              </div>
              <p class="activity-description" *ngIf="activity.description">
                {{ activity.description }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
