<div class="notification-bell">
  <button 
    class="bell-button" 
    (click)="togglePanel()"
    [class.has-unread]="unreadCount > 0"
  >
    <i class="bell-icon"><img src="assets/icons/Bell-Icon.svg" alt="Notification"></i>
    <span *ngIf="unreadCount > 0" class="badge">{{ unreadCount }}</span>
  </button>

  <div *ngIf="isPanelOpen" class="notification-panel">
    <div class="panel-header">
      <h3>Notifications</h3>
      <div class="panel-actions">
        <button *ngIf="notifications.length > 0" (click)="markAllAsRead()" class="action-btn">
          Mark all as read
        </button>
        <button *ngIf="notifications.length > 0" (click)="clearAll()" class="action-btn clear">
          Clear all
        </button>
      </div>
    </div>

    <div class="notifications-list">
      <div *ngIf="notifications.length === 0" class="empty-state">
        No notifications
      </div>
      
     <app-notification-item-component
  *ngFor="let notification of notifications"
  [notification]="notification"
  (read)="markAsRead($event)"
  (dismiss)="dismissNotification($event)"
  (navigate)="navigateToItem($event)">
</app-notification-item-component>
    </div>
  </div>
</div>
