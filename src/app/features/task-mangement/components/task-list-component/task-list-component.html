<div class="task-list">
  @if (tasks.length === 0) {
    <p class="empty">No tasks available.</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Assignee</th>
          <th>Due Date</th>
          <th>Project</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (task of tasks; track task.id) {
          <tr>
            <td><a [routerLink]="['/tasks', task.id]">{{ task.title }}</a></td>
            <td><span class="status {{ task.status.toLowerCase().replace(' ', '-') }}">{{ task.status }}</span></td>
            <td>{{ task.priority }}</td>
            <td>{{ task.assignee }}</td>
            <td>{{ task.dueDate | date }}</td>
            <td>{{ task.projectId }}</td>
            <td>
              <button class="edit">✏️</button>
              <button class="delete">🗑️</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
