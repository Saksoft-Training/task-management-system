<header class="app-header">
  <div class="header-container">
    <div class="logo">SakNgTrain</div>
    @if (!isAuthMinimal()) {
    <nav class="nav-links">
      @for (link of navLinks; track link.label) {
      <a [routerLink]="link.path" routerLinkActive="active">
        {{ link.label }}
      </a>
      }
    </nav>
    <div class="user-section">
      @if (user?.email) {
      <div class="user-email" (click)="goToLogin()">
        <img src="assets/icons/profile-Icon.svg" alt="profile" />
        <span>{{ user.email }}</span>
      </div>
      }
      <img
        src="assets/icons/logout-Icon.svg"
        alt="logout"
        class="logout-icon" />
    </div>
    }
  </div>
</header>
