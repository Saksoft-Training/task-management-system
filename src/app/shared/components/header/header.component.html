<header class="app-header">
  <div class="logo">SakNgTrain</div>
  @if (!isAuthMinimal()) {
  <div class="header-container">


    <nav class="nav-links">
      @for (link of navLinks; track link.label) {
      <a [routerLink]="link.path" routerLinkActive="active">
        {{ link.label }}
      </a>
      }
    </nav>
  </div>
  <div class="user-section">
    @if (userEmail) {
    <div class="user-email" (click)="goToLogin()">
      <img src="assets/icons/profile-Icon.svg" alt="profile" />
      <span>{{ userEmail }}</span>
    </div>
    }
    <div class="notification-container">
      <button class="bell-button" (click)="toggleNotifications()" type="button">
        <img src="assets/icons/Bell-Icon.svg" alt="notifications" class="bell-icon" />
        @if (unreadCount > 0) {
        <span class="notification-badge">{{ unreadCount }}</span>
        }
      </button>
      @if (showNotifications) {
      <div class="notification-dropdown">
        <app-notification-dropdown [notifications]="(notifications$ | async) || []"
          (closeDropdown)="showNotifications = false" (markAsRead)="onMarkAsRead($event)"
          (markAllRead)="onMarkAllRead()" (clearAll)="onClearAll()" (navigate)="onNavigateNotification($event)">
        </app-notification-dropdown>
      </div>
      }
    </div>
    <img src="assets/icons/logout-Icon.svg" alt="logout" class="logout-icon" (click)="openLogoutDialog()">
  </div>
  }
</header>

@if (showLogoutDialog) {
<app-confirmation-dialog-component title="LOGOUT" message="Are you sure you want to logout?
You will be logged out and redirected to the login page.
Your session data will be cleared for security." confirmText="Logout" cancelText="Cancel" type="danger"
  (confirm)="confirmLogout()" (cancel)="cancelLogout()">
</app-confirmation-dialog-component>
}
